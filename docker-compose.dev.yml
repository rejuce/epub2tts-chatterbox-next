# Dev container for epub2tts-chatterbox — use with Portainer or `docker compose`.
#
# The image is built automatically (see the `build:` section below) — no manual
# `docker build` needed. It is tagged `epub2tts-chatterbox-dev` (the `image:` name).
#   CLI:       docker compose -f docker-compose.dev.yml up -d --build
#   Portainer: create/update the stack, then "Deploy"/"Recreate" (builds the image).
#
# SSH in:
#   ssh -i /workspace/repos/keys/epub2tts/github-epub2tts \
#       -o StrictHostKeyChecking=accept-new -p 2222 root@<host>

services:
  dev:
    
    # Build the image from the repo root using Dockerfile-dev (includes web/ +
    # the auto-start entrypoint). Compose tags it with the `image:` name above.
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: epub2tts-chatterbox-dev
    restart: unless-stopped

    # --- GPU: only GPU 1 ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface

    ports:
      - "2222:22"

    volumes:
      # eBooks + jobs + samples
      - /mnt/dm5/_ebook:/data
      # Chatterbox model cache (persistent across container rebuilds)
      - /mnt/models/epub2tts:/root/.cache/huggingface
      # SSH keypair (read-only) — entrypoint wires .pub into authorized_keys
      - /workspace/repos/keys/epub2tts:/root/.ssh:ro
