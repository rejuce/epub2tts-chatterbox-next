<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}epub2tts-chatterbox-next{% endblock %}</title>
<script>{{ htmx_src | safe }}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================== Modern Reader — theme variables ===================== */
  /* Light theme is the default; .app.dark reassigns every variable below, so the
     toggle is just one class swap. All components read from these vars. */
  :root {
    --bg:#fafaf7; --panel:#ffffff; --panel-2:#f6f7f4; --line:#eceae3;
    --text:#2a2f2c; --dim:#6b7268; --accent:#3a5a52; --accent-2:#7ba7a0;
    --ok:#4a6a3f; --warn:#8a7a3f; --err:#a05050; --muted:#8b928c;
    --shadow:rgba(31,36,33,.08); --ink:#1f2421; --paper:#eef0ea;
  }
  .app.dark {
    --bg:#151a17; --panel:#1b211d; --panel-2:#1d2320; --line:#262d28;
    --text:#e4ebe4; --dim:#8f9c90; --accent:#5c7a6f; --accent-2:#8fbf94;
    --ok:#bcd6b4; --warn:#ecd6a0; --err:#f2c9b2; --muted:#9aa89a;
    --shadow:rgba(0,0,0,.35); --ink:#f2f5f2; --paper:#d3d8ce;
  }

  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* ---- header / logo ---- */
  header { display:flex; align-items:center; gap:16px; padding:12px 22px;
           background:var(--panel); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:10;
           box-shadow:0 1px 2px var(--shadow); }
  .logo { display:flex; align-items:center; gap:10px;
          font-family:"Lora",Georgia,serif; font-weight:700; font-size:17px;
          color:var(--accent); letter-spacing:-.01em; }
  .logo:hover { text-decoration:none; }
  .logo .word { color:var(--ink); }
  .logo svg .page { fill:var(--paper); }
  header nav { display:flex; gap:16px; margin-left:auto; align-items:center; }
  header nav a { color:var(--dim); font-size:14px; font-weight:500; padding:4px 0;
                 border-bottom:2px solid transparent; }
  header nav a:hover { color:var(--text); text-decoration:none; }
  header nav a.on { color:var(--accent); border-bottom-color:var(--accent); }

  /* light/dark toggle */
  .theme-toggle {
    position:relative; display:inline-flex; align-items:center; gap:7px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:20px;
    padding:5px 13px 5px 32px; font-size:12px; color:var(--dim); cursor:pointer;
    font-family:inherit; font-weight:600; transition:.2s;
  }
  .theme-toggle:hover { border-color:var(--accent-2); }
  .theme-toggle .knob {
    position:absolute; left:5px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; border-radius:50%;
    background:#fff; border:1px solid #d8d5cc;
    box-shadow:0 1px 3px rgba(0,0,0,.18); transition:.2s;
  }
  .theme-toggle .ic { width:13px; height:13px; }
  .theme-toggle .ic-moon { display:block; }
  .theme-toggle .ic-sun  { display:none; }
  .app.dark .theme-toggle { background:var(--panel); color:var(--muted);
                            padding-left:13px; padding-right:32px; }
  .app.dark .theme-toggle .knob { left:auto; right:5px; background:var(--accent-2);
                                  border-color:var(--accent-2);
                                  box-shadow:0 1px 4px rgba(143,191,148,.5); }
  .app.dark .theme-toggle .ic-moon { display:none; }
  .app.dark .theme-toggle .ic-sun  { display:block; }

  /* ---- layout ---- */
  .wrap { max-width:900px; margin:0 auto; padding:28px 22px 40px; }
  h2 { font-size:21px; margin:0 0 14px; color:var(--ink); font-weight:700;
       letter-spacing:-.01em; }

  /* ---- cards ---- */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
           gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:16px; box-shadow:0 2px 8px var(--shadow); transition:.15s; }
  .card:hover { box-shadow:0 8px 22px var(--shadow); transform:translateY(-1px); }
  .card .name { font-weight:600; color:var(--text); word-break:break-all; }
  .card .meta { color:var(--muted); font-size:13px; margin-top:6px; }

  /* ---- rows / fields ---- */
  .row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .field { margin-bottom:16px; flex:1; min-width:200px; }
  label { color:var(--dim); font-size:13px; display:block; margin-bottom:7px;
          font-weight:600; }
  textarea, input[type=text], select { width:100%; background:var(--panel-2);
      color:var(--text); border:1px solid var(--line); border-radius:10px;
      padding:11px 14px; font:inherit; box-shadow:0 1px 2px rgba(0,0,0,.02); }
  textarea:focus, input[type=text]:focus, select:focus {
      outline:none; border-color:var(--accent-2);
      box-shadow:0 0 0 3px rgba(123,167,160,.22); }

  /* ---- buttons ---- */
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:10px;
                 padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer;
                 font-family:inherit; transition:.15s; }
  button:hover, .btn:hover { filter:brightness(1.07); }
  button.danger { background:var(--err); }
  button.warn { background:var(--warn); color:#111; }
  button:disabled { opacity:.45; cursor:default; }

  /* ---- tables ---- */
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.04em; }

  /* ---- state badges ---- */
  .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px;
           font-weight:600; white-space:nowrap; background:var(--panel-2);
           color:var(--dim); border:1px solid var(--line); }
  .badge.TRANSCRIBING { background:rgba(123,167,160,.16); color:var(--accent-2);
                        border-color:rgba(123,167,160,.4); }
  .badge.ENCODING { background:rgba(123,167,160,.16); color:var(--accent-2);
                    border-color:rgba(123,167,160,.4); }
  .badge.DONE { background:rgba(92,122,85,.16); color:var(--ok);
                border-color:rgba(92,122,85,.4); }
  .badge.FAILED { background:rgba(214,110,74,.16); color:var(--err);
                  border-color:rgba(214,110,74,.4); }
  .badge.CANCELLED { background:var(--panel-2); color:var(--muted);
                     border-color:var(--line); }
  .badge.AWAITING_REVIEW { background:rgba(214,168,74,.16); color:var(--warn);
                           border-color:rgba(214,168,74,.4); }

  /* ---- progress bar ---- */
  .progress { background:var(--panel-2); border:1px solid var(--line);
              border-radius:20px; height:24px; overflow:hidden; position:relative;
              min-width:220px; }
  .progress > div { background:linear-gradient(90deg,var(--accent),var(--accent-2));
                    height:100%; border-radius:20px; transition:width .8s; }
  .progress > span { position:absolute; inset:0; display:flex; align-items:center;
                     justify-content:center; font-size:12px; color:var(--ink);
                     font-weight:600; }

  /* ---- chapter blocks ---- */
  .ch { background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 4px var(--shadow); }
  .ch .ctitle { font-weight:600; margin-bottom:8px; }
  .ch .ctitle input { width:100%; }
  .ch .ctext { color:var(--dim); font-size:13px; white-space:pre-wrap;
               max-height:180px; overflow:auto; }

  /* ---- misc ---- */
  .error { color:var(--err); background:rgba(214,110,74,.08); border:1px solid var(--err);
           border-radius:8px; padding:12px; margin:12px 0; white-space:pre-wrap; }
  .hint { color:var(--dim); font-size:13px; }
  audio { width:100%; margin-top:10px; border-radius:8px; }
</style>
{% block head %}{% endblock %}
</head>
<body class="app">
<header>
  <a class="logo" href="/" aria-label="epub2tts-chatterbox-next home">
    <svg class="mark" viewBox="0 0 32 32" width="24" height="24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <path class="page" d="M16 15 C13.3 13.3 7.8 13 4.5 14.2 L4.5 25.6 C7.8 24.4 13.3 24.6 16 26 Z" stroke="none"/>
      <path class="page" d="M16 15 C18.7 13.3 24.2 13 27.5 14.2 L27.5 25.6 C24.2 24.4 18.7 24.6 16 26 Z" stroke="none"/>
      <path class="spine" d="M16 15 V26" fill="none" stroke="currentColor" stroke-width="0.9"/>
      <path class="wave" d="M12.5 11.5 A 4 4 0 0 0 19.5 11.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path class="wave" d="M9.5 8.5 A 7 7 0 0 0 22.5 8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path class="wave" d="M6.5 5.5 A 10 10 0 0 0 25.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span class="word">epub2tts-chatterbox-next</span>
  </a>
  <nav>
    <a href="/" {% if request.path == '/' %}class="on"{% endif %}>New book</a>
    <a href="/jobs" {% if request.path == '/jobs' %}class="on"{% endif %}>Jobs</a>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <span class="knob"></span>
      <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="t-label">Dark</span>
    </button>
  </nav>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script>
(function(){
  var el = document.body, btn = el.querySelector('.theme-toggle');
  if(!btn) return;
  // remember choice for this browser
  var saved = null;
  try { saved = localStorage.getItem('e2t-theme'); } catch(e){}
  if(saved === 'dark'){ el.classList.add('dark'); }
  function sync(){
    var dark = el.classList.contains('dark');
    btn.setAttribute('aria-pressed', String(dark));
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    var l = btn.querySelector('.t-label'); if(l) l.textContent = dark ? 'Light' : 'Dark';
  }
  sync();
  btn.addEventListener('click', function(){
    var dark = el.classList.toggle('dark');
    try { localStorage.setItem('e2t-theme', dark ? 'dark' : 'light'); } catch(e){}
    sync();
  });
})();
</script>
</body>
</html>
